<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Menu</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #fdfdfd;
      font-family: Arial, sans-serif;
    }
    a.button {
      padding: 15px 25px;
      background-color: #222;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size: 18px;
    }
    a.button:hover {
      background-color: #444;
    }
  </style>
</head>
<body>
  <a class="button" href="KOZAILY DIGITAL MENU 2.pdf" target="_blank">Open Full Menu</a>
</body>
</html>
